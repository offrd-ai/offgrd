name: check-parse
on:
  push:
    branches: [main]
  pull_request:
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      # After-opener: provision Chrome for smoke-playbook-drag CDP + bump checkout past Node 20.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm run check
